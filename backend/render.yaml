services:
  - type: web
    name: mmotors-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        value: mmotors-secret-key-production-2026
      - key: DATABASE_URL
        value: sqlite:///./mmotors.db
